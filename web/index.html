<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14181d">
<title>Car Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <span id="conn" class="dot bad" title="connection to the car"></span>
  <select id="mapSelect" aria-label="Map"></select>
  <button id="mapLoad" class="btn">Load map</button>
  <span id="chipLoc" class="chip bad">not localized</span>
</header>

<main id="stage">
  <canvas id="view"></canvas>
  <div id="hint"></div>
  <div id="toast"></div>

  <div id="confirm" hidden>
    <span id="confirmText"></span>
    <button id="confirmGo" class="btn go">Go</button>
    <button id="confirmNo" class="btn">Discard</button>
  </div>

  <section id="videoPanel" hidden>
    <div class="vhead">
      <span>Lane camera</span>
      <span class="spacer"></span>
      <button id="videoBig" class="mini" title="bigger / smaller">&#9974;</button>
      <button id="videoClose" class="mini" title="close">&#10005;</button>
    </div>
    <div class="vbody">
      <img id="video" alt="lane detection video">
      <div id="videoMsg">no camera video</div>
    </div>
  </section>

  <button id="stop" title="Cancel navigation and stop the car (Esc)">STOP</button>
</main>

<section id="info">
  <div><b>Map</b> <span id="iMap">-</span></div>
  <div><b>Car</b> <span id="iPose">-</span></div>
  <div><b>Speed</b> <span id="iSpeed">-</span></div>
  <div><b>Nav</b> <span id="iNav">idle</span></div>
</section>

<footer id="bar">
  <button id="mPan"  class="btn mode active">&#9995; Move view</button>
  <button id="mPose" class="btn mode">&#128205; Set pose</button>
  <button id="mGoal" class="btn mode">&#127937; Set goal</button>
  <button id="bCam"  class="btn">&#127909; Camera</button>
  <button id="bFit"  class="btn">Fit map</button>
  <label class="chk"><input type="checkbox" id="cFollow"> Follow car</label>
  <label class="chk"><input type="checkbox" id="cConfirm"> Confirm goals</label>
</footer>
<script src="app.js"></script>
</body>
</html>

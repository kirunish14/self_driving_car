planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]   # id must stay "GridBased" (used by the behavior tree)

    GridBased:
      # Hybrid-A*: plans paths that respect the car's minimum turning radius.
      # (NavFn ignores kinematics -> paths the Ackermann car physically cannot follow -> it crashes.)
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.3
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      motion_model_for_search: "DUBIN"      # no reversing in plans
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      # wheelbase 0.76 / tan(35 deg) = 1.085 m  -> use a safety margin
      minimum_turning_radius: 1.2
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 3.0                     # stay away from walls / obstacles
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0

    # DWB needs the real car velocity (default would be "/odom", which does not exist here)
    odom_topic: /ackermann_controller/odometry

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 3.14      # a car cannot rotate on the spot to match the goal yaw
      stateful: true

    # ---------------------------------------------------------------
    # Same obstacle logic as articubot_one: DWB local planner.
    # It simulates many (v, w) trajectories every cycle, throws away the ones
    # that hit the costmap, and scores the rest -> the robot slows down and
    # steers around obstacles instead of following the path blindly.
    # ---------------------------------------------------------------
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true

      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.30
      max_vel_y: 0.0
      # Ackermann limit: w <= v / R_min  (R_min = 0.76 / tan(35 deg) = 1.09 m)
      max_vel_theta: 0.25
      min_speed_xy: 0.0
      max_speed_xy: 0.30
      min_speed_theta: 0.0

      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0

      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 20

      # the car is 1.2 m long, so look further ahead than the 1.7 s of the small robot
      sim_time: 3.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.3
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true

      # RotateToGoal removed (car cannot spin); BaseObstacle -> ObstacleFootprint
      # (BaseObstacle only checks the robot centre, which is fine for a 0.22 m round
      # robot but would let the corners of a 1.3 x 0.7 m car hit walls)
      critics: ["Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0

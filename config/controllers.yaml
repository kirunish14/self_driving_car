controller_manager:
  ros__parameters:

    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_controller:
      type: ackermann_steering_controller/AckermannSteeringController


ackermann_controller:
  ros__parameters:

    # =========================================================
    # WHEELS
    # =========================================================

    front_wheels_names:
      - front_left_steering_joint
      - front_right_steering_joint

    rear_wheels_names:
      - rear_left_wheel_joint
      - rear_right_wheel_joint


    # =========================================================
    # VEHICLE GEOMETRY
    # =========================================================

    wheelbase: 0.76

    front_wheel_track: 0.60

    rear_wheel_track: 0.60

    front_wheels_radius: 0.10

    rear_wheels_radius: 0.10


    # =========================================================
    # STEERING
    # =========================================================

    front_steering: true


    # =========================================================
    # FEEDBACK
    # =========================================================

    position_feedback: false

    open_loop: false


    # =========================================================
    # COMMAND
    # =========================================================

    use_stamped_vel: false

    reference_timeout: 0.5


    # =========================================================
    # ODOMETRY / TF
    # =========================================================

    # IMPORTANT:
    # The robot_state_publisher provides:
    #
    #     base_footprint -> base_link
    #
    # Therefore the Ackermann controller should publish:
    #
    #     odom -> base_footprint
    #
    # giving the complete chain:
    #
    #     odom
    #       |
    #       v
    #     base_footprint
    #       |
    #       v
    #     base_link
    #       |
    #       +---- laser_frame
    #       +---- camera_link
    #

    base_frame_id: base_footprint

    odom_frame_id: odom

    enable_odom_tf: true

    velocity_rolling_window_size: 10


    # =========================================================
    # STEERING SAFETY
    # =========================================================

    reduce_wheel_speed_until_steering_reached: true


    # =========================================================
    # COVARIANCE
    # =========================================================

    pose_covariance_diagonal:
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.01

    twist_covariance_diagonal:
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.01
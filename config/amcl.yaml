amcl:
  ros__parameters:

    use_sim_time: true

    # ============================================================
    # FRAMES
    # ============================================================

    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link

    tf_broadcast: true
    transform_tolerance: 0.5

    # ============================================================
    # LASER
    # ============================================================

    scan_topic: /scan

    laser_min_range: 0.3
    laser_max_range: 12.0

    laser_model_type: likelihood_field

    laser_likelihood_max_dist: 2.0

    max_beams: 60

    # ============================================================
    # MOTION MODEL
    # ============================================================

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    odom_model_type: "diff"

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # ============================================================
    # PARTICLES
    # ============================================================

    min_particles: 500
    max_particles: 2000

    pf_err: 0.05
    pf_z: 0.99

    # ============================================================
    # UPDATE CONDITIONS
    # ============================================================

    update_min_d: 0.10
    update_min_a: 0.10

    resample_interval: 1

    # ============================================================
    # RECOVERY
    # ============================================================

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # ============================================================
    # INITIAL POSE
    # ============================================================

    set_initial_pose: false

    always_reset_initial_pose: false

    first_map_only: false

    # ============================================================
    # BEAM SKIPPING
    # ============================================================

    do_beamskip: false

    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
